[metadata]
name = mechanochat
version = 0.1.0
author = Xiangyu Kuang
author_email = xykuang1@gmail.com
description = Inference and visualization of mechanical cell-cell communication from spatial transcriptomics data
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/XiangyuKuang/mechanochat
project_urls =
    Source = https://github.com/XiangyuKuang/mechanochat
    Bug Tracker = https://github.com/XiangyuKuang/mechanochat/issues
license = MIT License
license_files = LICENSE
keywords = spatial transcriptomics, cell-cell communication, mechanobiology, subcellular element method
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    License :: OSI Approved :: MIT License
    Operating System :: POSIX :: Linux
    Topic :: Scientific/Engineering
    Topic :: Scientific/Engineering :: Bio-Informatics

[options]
zip_safe = False
include_package_data = True
package_dir=
    =src
packages = find:
python_requires = >=3.9,<3.12
install_requires =
    anndata>=0.10.9,<0.12
    matplotlib>=3.9.4,<4
    numba>=0.60.0
    # numpy is capped at <2 because torch 1.x is built against the numpy 1.x C API
    numpy>=1.24.3,<2
    pandas>=2.0.3,<3
    pyvista>=0.46.1
    scanpy>=1.10.3,<2
    scikit_learn>=1.3.0
    scipy>=1.10.1
    tqdm>=4.67.1
    python-igraph>=0.11.9
    # crosstalk analysis (_utils/SigXTalkpy); dhg 0.9.x itself requires torch<2.0
    torch>=1.13.1,<2
    xgboost>=2.1.4,<3
    dhg>=0.9.4,<0.10

[options.extras_require]
cuda11 =
    cuda-python>=11.8,<12
cuda12 =
    cuda-python>=12,<13

[options.package_data]
mechanochat.preprocessing =
    _data/LRdatabase/*.csv
    _data/MCdatabase/*.csv

[options.packages.find]
where=src
exclude =
    tests*
    docs*
    tutorials*
