[metadata]
name = mechanochat
version = 0.0.1
license = MIT License
classifiers =
    Programming Language :: Python :: 3.9
    License :: OSI Approved :: MIT License
    Operating System :: POSIX :: Linux
    Topic :: Scientific/Engineering
    Topic :: Scientific/Engineering :: Bio-Informatics

[options]
zip_safe = False
include_package_data = True
package_dir=
    =src
packages = find:
python_requires = >=3.9
install_requires =
    anndata==0.10.9
    matplotlib==3.9.4
    numba>=0.60.0
    numpy>=1.24.3,<3
    pandas>=2.0.3,<3
    pyvista>=0.46.1
    scanpy==1.10.3
    scikit_learn>=1.3.0
    scipy>=1.10.1
    tqdm>=4.67.1
    python-igraph>=0.11.9

[options.extras_require]
# NVIDIA cuda-python bindings: required for numba GPU on new drivers (CUDA 13 / 驱动 580+),
# 此时 numba 0.60 内置的 ctypes 驱动绑定会 segfault。
# 安装后还需设环境变量 NUMBA_CUDA_USE_NVIDIA_BINDING=1（在 import numba 之前）才会生效。
# 按本机 CUDA toolkit 主版本选择：pip install mechanochat[cuda11] 或 mechanochat[cuda12]
cuda11 =
    cuda-python>=11.8,<12
cuda12 =
    cuda-python>=12,<13

[options.package_data]
* = *.txt, *.rst
hello = *.msg

[options.packages.find]
where=src
exclude =
    tests*
    docs*
    tutorials*
